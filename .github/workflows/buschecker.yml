
name: Check Keighley Buses

on:
  schedule:
    # Runs automatically every 5 minutes, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-buses:
    runs-on: ubuntu-latest
    steps:
      - name: Get Current Date
        id: date
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Restores today's log file if it exists
      - name: Restore Today's Alert Cache
        uses: actions/cache/restore@v4
        with:
          path: alerted_buses.txt
          key: bus-alerts-${{ env.TODAY }}

      - name: Check Keighley Bus Tracking
        run: |
          NTFY_TOPIC="tracking-jacie-bus"

          # Create log file if it doesn't exist yet
          touch alerted_buses.txt

          declare -A BUSES=(
            ["kdtr-2402-yj04lyh"]="2402"
            ["kdtr-2403-yj04lyk"]="2403"
            ["kdtr-2404-yj04lyp"]="2404"
            ["kdtr-2750-sn57gnj"]="2450"
            ["kdtr-2756-pj05zwc"]="2756"
            ["kdtr-2757-pj05zwd"]="2757"
            ["kdtr-2759-pj05zwf"]="2759"
          )

          ROUTES_PATTERN="\b(60|60A|62|64|66|67|72|75|662|820|821|862|864|866|873|B1|B2|B3|K1|K2|K3|K4|K5|K6|K7|K9|K11|K12|K14|K15|K16)\b"

          for BUS_ID in "${!BUSES[@]}"; do
            FLEET_NO="${BUSES[$BUS_ID]}"
            URL="https://bustimes.org/vehicles/${BUS_ID}"
            
            # Check if we already alerted on this bus today
            if grep -q "$FLEET_NO" alerted_buses.txt; then
              echo "Bus $FLEET_NO was already reported today. Skipping."
              continue
            fi

            HTML=$(curl -s "$URL")

            # Verify active tracking on valid route
            if echo "$HTML" | grep -qE "(just now|[1-9] mins? ago)" && echo "$HTML" | grep -qE "$ROUTES_PATTERN"; then
              echo "Bus $FLEET_NO is live! Sending alert..."
              
              curl -s \
                   -H "Title: Keighley Bus Alert" \
                   -H "Priority: high" \
                   -d "Bus $FLEET_NO is live on bustimes.org! Check: $URL" \
                   "https://ntfy.sh/${NTFY_TOPIC}"

              # Log fleet number to file so it won't trigger again today
              echo "$FLEET_NO" >> alerted_buses.txt
            else
              echo "Bus $FLEET_NO is not active or hasn't started yet."
            fi
          done

      # Saves the updated log file back to cache
      - name: Save Today's Alert Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: alerted_buses.txt
          key: bus-alerts-${{ env.TODAY }}

