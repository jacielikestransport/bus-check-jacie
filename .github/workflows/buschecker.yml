name: Check Keighley Buses

on:
  schedule:
    # Runs automatically every 5 minutes, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub

jobs:
  check-buses:
    runs-on: ubuntu-latest
    steps:
      - name: Check Keighley Bus Tracking
        run: |
          NTFY_TOPIC="tracking-jacie-bus"

          declare -A BUSES=(
            ["kdtr-2402-yj04lyh"]="2402"
            ["kdtr-2403-yj04lyk"]="2403"
            ["kdtr-2404-yj04lyp"]="2404"
            ["kdtr-2450-sn57gnj"]="2450"
            ["kdtr-2756-pj05zwc"]="2756"
            ["kdtr-2757-pj05zwd"]="2757"
            ["kdtr-2759-pj05zwf"]="2759"
          )

          ROUTES_PATTERN="\b(60|60A|62|64|66|67|72|75|662|820|821|862|864|866|873|B1|B2|B3|K1|K2|K3|K4|K5|K6|K7|K9|K11|K12|K14|K15|K16)\b"

          # Get today's date formatted as bustimes.org displays it (e.g., "18 Aug")
          TODAY_DATE=$(date +"%-d %b")

          for BUS_ID in "${!BUSES[@]}"; do
            FLEET_NO="${BUSES[$BUS_ID]}"
            URL="https://bustimes.org/vehicles/${BUS_ID}"
            
            HTML=$(curl -s "$URL")

            # Must match today's date, an active Map link, and an allowed route
            if echo "$HTML" | grep -q "$TODAY_DATE" && echo "$HTML" | grep -q "Map" && echo "$HTML" | grep -qE "$ROUTES_PATTERN"; then
              echo "Bus $FLEET_NO is tracking today ($TODAY_DATE)!"
              
              curl -s -d "Keighley $FLEET_NO tracking." \
                   -H "Title: Keighley Bus Alert" \
                   "https://ntfy.sh/${NTFY_TOPIC}"
            else
              echo "Bus $FLEET_NO is not actively tracking today."
            fi
          done
